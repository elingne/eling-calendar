<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calendar</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: #fff8fb; color: #8a909b; font-family: system-ui, "Segoe UI", sans-serif; text-align: center; }
    p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; }
    button { padding: 8px 16px; border: 0; border-radius: 10px; background: #fbdbe7; color: #b5506e; font: inherit; font-weight: 700; cursor: pointer; }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <p id="message">My Calendar 불러오는 중…</p>
    <button id="retry" type="button" hidden>다시 시도</button>
  </main>
  <script>
    // 사이트 주소를 바꾸려면 여기와 src-tauri/capabilities/main.json 의 주소를 함께 바꿔주세요.
    const SITE_URL = 'https://eling-calendar.ielingkk.workers.dev/';
    const message = document.getElementById('message');
    const retry = document.getElementById('retry');
    let timer = null;
    async function open() {
      clearTimeout(timer);
      retry.hidden = true;
      message.textContent = 'My Calendar 불러오는 중…';
      try {
        // 인터넷이 연결돼 있는지만 확인한다 (응답 내용은 읽지 않는다).
        await fetch(SITE_URL, { mode: 'no-cors', cache: 'no-store' });
        location.replace(SITE_URL);
      } catch {
        message.textContent = '인터넷에 연결되면 자동으로 열려요.';
        retry.hidden = false;
        timer = setTimeout(open, 5000);
      }
    }
    retry.addEventListener('click', open);
    open();
  </script>
</body>
</html>
