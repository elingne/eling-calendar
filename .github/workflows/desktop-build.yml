# 데스크톱 위젯(desktop/) 설치 파일을 Windows에서 만들어 줍니다. 사이트 배포(Cloudflare)와는 별개이며 사이트에는 영향이 없습니다.
# 사용법: GitHub 저장소 → Actions → "Desktop app (Windows installer)" → Run workflow → 끝나면 아래쪽 Artifacts 에서 설치 파일을 내려받습니다.
name: Desktop app (Windows installer)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Tauri CLI
        run: npm install
      - name: Build installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: my-calendar-windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
